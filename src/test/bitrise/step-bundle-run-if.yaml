# yaml-language-server: $schema=../../schemas/json/bitrise.json
format_version: 1.3.0
default_step_lib_source: 'https://github.com/bitrise-io/bitrise-steplib.git'

workflows:
  test:
    envs:
      - RUN_IF_1: 'true'
      - RUN_IF_2: 'false'
      - RUN_IF_3: 'true'
    steps:
      - script:
          inputs:
            - content: echo "script"
      - bundle::run_if_test_1:
      - bundle::run_if_test_3:
  deploy:
    steps:
      - bundle::run_if_test_1: {}
      - bundle::run_if_test_2:
          run_if: '{{ not (envcontain "BITRISE_GIT_MESSAGE" "[draft]") }}'
      - bundle::run_if_test_3:
          run_if: ''

step_bundles:
  run_if_test_1:
    run_if: '{{enveq "RUN_IF_1" "true"}}'
    steps:
      - script@1:
          title: run_if_test_1 script
          inputs:
            - content: echo "run_if_test_1.script"
      - bundle::run_if_test_2: {}
  run_if_test_2:
    run_if: '{{enveq "RUN_IF_2" "true"}}'
    steps:
      - script@1:
          title: run_if_test_2 script
          inputs:
            - content: echo "run_if_test_2.script"
      - bundle::run_if_test_3:
  run_if_test_3:
    run_if: '{{enveq "RUN_IF_3" "true"}}'
    steps:
      - script@1:
          title: run_if_test_3 script
          inputs:
            - content: echo "run_if_test_3.script"
      - bundle::run_if_test_4:
          run_if: '{{ not .IsBuildFailed }}'
  run_if_test_4:
    steps:
      - script@1:
          inputs:
            - content: echo "run_if_test_4.script"
